name: Companion and SDK compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/checkout@v4
        with:
          repository: facebookincubator/muse-gadget-sdk
          ref: f60347aeb851a1fe9438cfc388721776aa24f275
          path: artifacts/upstream
      - run: python scripts/prepare_sdk.py --source artifacts/upstream --destination artifacts/sdk-worktree
      - run: python -m pip install -e '.[test]' -e artifacts/sdk-worktree/linux build
      - run: python -m pytest -q
      - run: python -m pytest -q -c artifacts/sdk-worktree/linux/pyproject.toml artifacts/sdk-worktree/linux/tests
      - run: python scripts/audit_public.py
      - run: python -m build --wheel
